name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读代码、写 Pages、取 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发推送互相覆盖；但不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 若仓库还没开启 Pages，自动开启（免去手动去 Settings 点一遍）
          enablement: true

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
